name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            XCODE="/Applications/Xcode_$WANT.app"
          else
            XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Create configuration
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "Secrets TG_API_ID / TG_API_HASH are missing"; exit 1
          fi
          python3 - <<'EOF'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          c["api_id"] = os.environ["API_ID"]
          c["api_hash"] = os.environ["API_HASH"]
          json.dump(c, open("build-system/my-configuration.json", "w"), indent=2)
          EOF

      - name: Copy sources to stable path
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown $(whoami) /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Ignore expired fake profiles
        run: |
          cd /Users/Shared/telegram-ios
          F=build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py
          sed -i '' 's/raise PlistToolError(ENTITLEMENTS_PROFILE_HAS_EXPIRED/print(ENTITLEMENTS_PROFILE_HAS_EXPIRED/' "$F"
          grep -n "ENTITLEMENTS_PROFILE_HAS_EXPIRED %" "$F"

      - name: Keep deleted messages
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          import re, pathlib, sys
          root = pathlib.Path("submodules/TelegramCore/Sources")
          names = ["applyDeleteMessagesWithGlobalIds", "applyDeleteMessages"]
          found = {n: 0 for n in names}
          for f in root.rglob("*.swift"):
              s = f.read_text(encoding="utf-8", errors="ignore")
              orig = s
              for name in names:
                  pat = re.compile(r"^([ \t]*)func " + name + r"\(_ (\w+): \[[^\]]+\]\)[ \t]*\{[ \t]*\n", re.M)
                  def repl(m):
                      ind = m.group(1) + "    "
                      return m.group(0) + ind + "if !" + m.group(2) + ".isEmpty { return } // MyGram: keep deleted messages\n"
                  s, n = pat.subn(repl, s)
                  if n:
                      print(f, name, "patched:", n)
                      found[name] += n
              if s != orig:
                  f.write_text(s, encoding="utf-8")
          missing = [n for n, c in found.items() if c == 0]
          if missing:
              print("NOT FOUND:", missing)
              sys.exit(1)
          print("OK:", found)
          EOF
          grep -rn "MyGram: keep deleted" submodules/TelegramCore/Sources

      - name: Sideload fix (no App Group)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramUI/Sources/AppDelegate.swift"
          s = open(p, encoding="utf-8").read()
          old = "let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)"
          new = old + " ?? FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first"
          if old not in s:
              raise SystemExit("AppGroup line not found")
          s = s.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched AppGroup fallback")
          EOF
          grep -n "maybeAppGroupUrl = " submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Sideload fix (no iCloud / CloudKit)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramCore/Sources/Network/Network.swift"
          s = open(p, encoding="utf-8").read()
          old = "!supplementary, arguments.isICloudEnabled {"
          new = '!supplementary, arguments.isICloudEnabled && ProcessInfo.processInfo.environment["MYGRAM_ICLOUD"] != nil {'
          if old not in s:
              raise SystemExit("CloudKit line not found")
          s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patched CloudKit off")
          EOF
          grep -n "MYGRAM_ICLOUD" submodules/TelegramCore/Sources/Network/Network.swift

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/my-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=$(find -L bazel-out -name Telegram.ipa -path '*opt*' | head -n 1)
          echo "IPA: $IPA"
          cp "$IPA" "$GITHUB_WORKSPACE/out/MyGram.ipa"

      - name: Change Bundle ID and name
        run: |
          cd "$GITHUB_WORKSPACE/out"
          rm -rf ipa && mkdir ipa && cd ipa
          unzip -q ../MyGram.ipa
          rm -rf Payload/*.app/PlugIns Payload/*.app/Watch Payload/*.app/Extensions
          python3 - <<'EOF'
          import plistlib, pathlib
          OLD = "ph.telegra.Telegraph"
          NEW = "com.mygram.app"
          NAME = "MyGram"
          def fix(v):
              if isinstance(v, str):
                  return NEW + v[len(OLD):] if v.startswith(OLD) else v
              if isinstance(v, list):
                  return [fix(x) for x in v]
              if isinstance(v, dict):
                  return {k: fix(x) for k, x in v.items()}
              return v
          app = next(pathlib.Path("Payload").glob("*.app"))
          for p in app.rglob("Info.plist"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              d = fix(d)
              if p.parent == app:
                  d["CFBundleDisplayName"] = NAME
                  d["CFBundleName"] = NAME
              p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
              print("fixed", p, d.get("CFBundleIdentifier"))
          for p in app.glob("*.lproj/InfoPlist.strings"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              if "CFBundleDisplayName" in d:
                  d["CFBundleDisplayName"] = NAME
                  p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
          EOF
          rm -f ../MyGram.ipa
          zip -qry ../MyGram.ipa Payload
          cd .. && rm -rf ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MyGram-ipa
          path: out/MyGram.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MyGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Unsigned build. Sign and install via KSign.
          files: out/MyGram.ipa
