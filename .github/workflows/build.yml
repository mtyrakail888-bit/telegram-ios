          unzip -q ../MyGram.ipa
          rm -rf Payload/*.app/PlugIns Payload/*.app/Watch Payload/*.app/Extensions
          python3 - <<'EOF'
          import plistlib, pathlib
          OLD = "ph.telegra.Telegraph"
          NEW = "com.mygram.app"
          NAME = "MyGram"
          def fix(v):
              if isinstance(v, str):
                  return NEW + v[len(OLD):] if v.startswith(OLD) else v
              if isinstance(v, list):
                  return [fix(x) for x in v]
              if isinstance(v, dict):
                  return {k: fix(x) for k, x in v.items()}
              return v
          app = next(pathlib.Path("Payload").glob("*.app"))
          for p in app.rglob("Info.plist"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              d = fix(d)
              if p.parent == app:
                  d["CFBundleDisplayName"] = NAME
                  d["CFBundleName"] = NAME
              p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
              print("fixed", p, d.get("CFBundleIdentifier"))
          for p in app.glob("*.lproj/InfoPlist.strings"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              if "CFBundleDisplayName" in d:
                  d["CFBundleDisplayName"] = NAME
                  p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
          EOF
          # MyGram icons: black = main, white = alternate
          APP=$(ls -d Payload/*.app | head -n 1)
          for V in Black White; do
            SRC="$GITHUB_WORKSPACE/mygram_icons/$(echo $V | tr 'A-Z' 'a-z').png"
            for S in 20 29 40 60 76 83.5; do
              for M in 1 2 3; do
                PX=$(python3 -c "print(round($S*$M))")
                N="MyGram${V}${S}x${S}"; [ $M -gt 1 ] && N="$N@${M}x"
                sips -s format png -z $PX $PX "$SRC" --out "$APP/$N.png" >/dev/null
              done
            done
          done
          python3 - <<'EOF'
          import plistlib, pathlib
          app = next(pathlib.Path("Payload").glob("*.app"))
          p = app / "Info.plist"
          d = plistlib.loads(p.read_bytes())
          sizes = ["20", "29", "40", "60", "76", "83.5"]
          def files(v):
              return ["MyGram%s%sx%s" % (v, s, s) for s in sizes]
          for key in ["CFBundleIcons", "CFBundleIcons~ipad"]:
              d[key] = {
                  "CFBundlePrimaryIcon": {"CFBundleIconFiles": files("Black"), "UIPrerenderedIcon": True},
                  "CFBundleAlternateIcons": {"MyGramWhite": {"CFBundleIconFiles": files("White"), "UIPrerenderedIcon": True}},
              }
          d.pop("CFBundleIconName", None)
          d.pop("CFBundleIconFile", None)
          d.pop("CFBundleIconFiles", None)
          p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
          print("icons set:", d["CFBundleIcons"])
          EOF
          ls "$APP" | grep MyGram | head -50

          rm -f ../MyGram.ipa
          zip -qry ../MyGram.ipa Payload
          cd .. && rm -rf ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MyGram-ipa
          path: out/MyGram.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MyGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Unsigned build. Sign and install via KSign.
          files: out/MyGram.ipa
