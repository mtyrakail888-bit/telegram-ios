name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            XCODE="/Applications/Xcode_$WANT.app"
          else
            XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Create configuration
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "Secrets TG_API_ID / TG_API_HASH are missing"; exit 1
          fi
          python3 - <<'EOF'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          c["api_id"] = os.environ["API_ID"]
          c["api_hash"] = os.environ["API_HASH"]
          json.dump(c, open("build-system/my-configuration.json", "w"), indent=2)
          EOF

      - name: Copy sources to stable path
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown $(whoami) /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Ignore expired fake profiles
        run: |
          cd /Users/Shared/telegram-ios
          F=build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py
          sed -i '' 's/raise PlistToolError(ENTITLEMENTS_PROFILE_HAS_EXPIRED/print(ENTITLEMENTS_PROFILE_HAS_EXPIRED/' "$F"
          grep -n "ENTITLEMENTS_PROFILE_HAS_EXPIRED %" "$F"

      - name: Keep deleted messages (red trash icon)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          # 1) TelegramCore: keep deleted messages and remember their ids
          p = "submodules/TelegramCore/Sources/State/Sync/StateReplay+Messages.swift"
          s = open(p, encoding="utf-8").read()
          a = "    func applyDeleteMessagesWithGlobalIds(_ ids: [Int32]) {\n"
          b = "    func applyDeleteMessages(_ ids: [MessageId]) {\n"
          if a not in s or b not in s:
              raise SystemExit("delete functions not found")
          s = s.replace(a, a + "        if !ids.isEmpty { myGramMarkDeleted(transaction.messageIdsForGlobalIds(ids)); return } // MyGram: keep deleted messages\n", 1)
          s = s.replace(b, b + "        if !ids.isEmpty { myGramMarkDeleted(ids); return } // MyGram: keep deleted messages\n", 1)
          s += r'''

          public final class MyGramDeletedStore: @unchecked Sendable {
              public static let shared = MyGramDeletedStore()
              private let lock = NSLock()
              private var ids: Set<String>

              private init() {
                  self.ids = Set(UserDefaults.standard.stringArray(forKey: "MyGramDeletedMessages") ?? [])
              }

              private static func key(_ id: MessageId) -> String {
                  return "\(id.peerId.toInt64()):\(id.namespace):\(id.id)"
              }

              public func contains(_ id: MessageId) -> Bool {
                  self.lock.lock()
                  defer { self.lock.unlock() }
                  return self.ids.contains(MyGramDeletedStore.key(id))
              }

              public func add(_ newIds: [MessageId]) {
                  self.lock.lock()
                  for id in newIds {
                      self.ids.insert(MyGramDeletedStore.key(id))
                  }
                  let all = Array(self.ids)
                  self.lock.unlock()
                  UserDefaults.standard.set(all, forKey: "MyGramDeletedMessages")
              }
          }

          public func myGramIsMessageDeleted(_ id: MessageId) -> Bool {
              return MyGramDeletedStore.shared.contains(id)
          }

          extension ReplayContext {
              func myGramMarkDeleted(_ ids: [MessageId]) {
                  MyGramDeletedStore.shared.add(ids)
                  for id in ids {
                      transaction.updateMessage(id, update: { currentMessage in
                          let storeForwardInfo = currentMessage.forwardInfo.flatMap(StoreMessageForwardInfo.init)
                          return .update(StoreMessage(id: currentMessage.id, customStableId: nil, globallyUniqueId: currentMessage.globallyUniqueId, groupingKey: currentMessage.groupingKey, threadId: currentMessage.threadId, timestamp: currentMessage.timestamp, flags: StoreMessageFlags(currentMessage.flags), tags: currentMessage.tags, globalTags: currentMessage.globalTags, localTags: currentMessage.localTags, forwardInfo: storeForwardInfo, authorId: currentMessage.author?.id, text: currentMessage.text, attributes: currentMessage.attributes, media: currentMessage.media))
                      })
                  }
              }
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched TelegramCore")

          # 2) Time string: add invisible marker for deleted messages
          p = "submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/StringForMessageTimestampStatus.swift"
          s = open(p, encoding="utf-8").read()
          old = "public func stringForMessageTimestampStatus("
          if s.count(old) != 1:
              raise SystemExit("stringForMessageTimestampStatus not found")
          s = s.replace(old, "private func myGramOriginalStringForMessageTimestampStatus(")
          s += r'''

          public func stringForMessageTimestampStatus(
              context: AccountContext,
              message: EngineMessage,
              dateTimeFormat: PresentationDateTimeFormat,
              nameDisplayOrder: PresentationPersonNameOrder,
              strings: PresentationStrings,
              format: MessageTimestampStatusFormat = .regular,
              associatedData: ChatMessageItemAssociatedData,
              ignoreAuthor: Bool = false
          ) -> String {
              let result = myGramOriginalStringForMessageTimestampStatus(context: context, message: message, dateTimeFormat: dateTimeFormat, nameDisplayOrder: nameDisplayOrder, strings: strings, format: format, associatedData: associatedData, ignoreAuthor: ignoreAuthor)
              if myGramIsMessageDeleted(message.id) {
                  return result + "\u{2063}"
              }
              return result
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched timestamp string")

          # 3) Date node: red trash icon next to the time
          p = "submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/ChatMessageDateAndStatusNode.swift"
          s = open(p, encoding="utf-8").read()
          old1 = "        return { [weak self] arguments in\n"
          old2 = "            var updatedDateText = arguments.dateText\n"
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit("date node anchors not found")
          s = s.replace(old1, "        return { [weak self] myGramArguments in\n            let (arguments, myGramIsDeleted) = myGramFixDateArguments(myGramArguments)\n")
          s = s.replace(old2, "            if myGramIsDeleted && arguments.replyCount == 0 {\n                repliesImage = myGramTrashImage()\n            }\n" + old2)
          s += r'''

          private func myGramFixDateArguments(_ arguments: ChatMessageDateAndStatusNode.Arguments) -> (ChatMessageDateAndStatusNode.Arguments, Bool) {
              guard arguments.dateText.hasSuffix("\u{2063}") else {
                  return (arguments, false)
              }
              var result = arguments
              result.dateText = String(arguments.dateText.dropLast())
              result.isPinned = true
              return (result, true)
          }

          private func myGramTrashImage() -> UIImage? {
              guard let symbol = UIImage(systemName: "trash.fill", withConfiguration: UIImage.SymbolConfiguration(pointSize: 9.0, weight: .semibold))?.withTintColor(UIColor(red: 1.0, green: 0.23, blue: 0.19, alpha: 1.0), renderingMode: .alwaysOriginal) else {
                  return nil
              }
              let renderer = UIGraphicsImageRenderer(size: symbol.size)
              return renderer.image { _ in
                  symbol.draw(at: CGPoint())
              }
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched date node")
          EOF
          grep -n "MyGram\|myGram" submodules/TelegramCore/Sources/State/Sync/StateReplay+Messages.swift | head
          grep -n "myGram" submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/*.swift

      - name: Ghost mode (full, with switches)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          def patch(s, old, new, count=1):
              if s.count(old) != count:
                  raise SystemExit("anchor not found: " + old[:80])
              return s.replace(old, new)

          # 1) Presence: never send "online" while "hide online" is on
          p = "submodules/TelegramCore/Sources/State/ManagedAccountPresence.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s,
              "    private func updatePresence(_ isOnline: Bool) {\n        let request: Signal<Api.Bool, MTRpcError>\n        if isOnline {\n",
              "    private func updatePresence(_ isOnline: Bool) {\n        let request: Signal<Api.Bool, MTRpcError>\n        if isOnline && !UserDefaults.standard.bool(forKey: \"MyGramGhostMode\") {\n")
          open(p, "w", encoding="utf-8").write(s)
          print("patched presence")

          # 2) Network: drop read receipts / typing / story views when the switch is on
          p = "submodules/TelegramCore/Sources/Network/Network.swift"
          s = open(p, encoding="utf-8").read()
          guard = "        if myGramShouldBlockRequest(data.0.name) { return .complete() } // MyGram ghost\n"
          s = patch(s,
              "    func request<T>(_ data: (FunctionDescription, Buffer, DeserializeFunctionResponse<T>), tag: NetworkRequestDependencyTag? = nil, automaticFloodWait: Bool = true, onFloodWaitError: ((String) -> Void)? = nil) -> Signal<T, MTRpcError> {\n",
              "    func request<T>(_ data: (FunctionDescription, Buffer, DeserializeFunctionResponse<T>), tag: NetworkRequestDependencyTag? = nil, automaticFloodWait: Bool = true, onFloodWaitError: ((String) -> Void)? = nil) -> Signal<T, MTRpcError> {\n" + guard)
          s = patch(s,
              "    func requestWithAdditionalInfo<T>(_ data: (FunctionDescription, Buffer, DeserializeFunctionResponse<T>), info: NetworkRequestAdditionalInfo, tag: NetworkRequestDependencyTag? = nil, automaticFloodWait: Bool = true, onFloodWaitError: ((String) -> Void)? = nil) -> Signal<NetworkRequestResult<T>, MTRpcError> {\n",
              "    func requestWithAdditionalInfo<T>(_ data: (FunctionDescription, Buffer, DeserializeFunctionResponse<T>), info: NetworkRequestAdditionalInfo, tag: NetworkRequestDependencyTag? = nil, automaticFloodWait: Bool = true, onFloodWaitError: ((String) -> Void)? = nil) -> Signal<NetworkRequestResult<T>, MTRpcError> {\n" + guard)
          s += r'''

          private let myGramGhostRules: [String: String] = [
              "messages.readHistory": "MyGramGhostRead",
              "channels.readHistory": "MyGramGhostRead",
              "messages.readEncryptedHistory": "MyGramGhostRead",
              "messages.readDiscussion": "MyGramGhostRead",
              "messages.readMessageContents": "MyGramGhostRead",
              "channels.readMessageContents": "MyGramGhostRead",
              "messages.setTyping": "MyGramGhostTyping",
              "messages.setEncryptedTyping": "MyGramGhostTyping",
              "stories.readStories": "MyGramGhostStories",
              "stories.incrementStoryViews": "MyGramGhostStories"
          ]

          func myGramShouldBlockRequest(_ name: String) -> Bool {
              guard let key = myGramGhostRules[name] else {
                  return false
              }
              return UserDefaults.standard.bool(forKey: key)
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched network")
          EOF
          grep -n "MyGramGhostMode" submodules/TelegramCore/Sources/State/ManagedAccountPresence.swift
          grep -n "myGramShouldBlockRequest" submodules/TelegramCore/Sources/Network/Network.swift

      - name: Visual profile (only for me)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          def patch(s, old, new, count=1):
              if s.count(old) != count:
                  raise SystemExit("anchor not found: " + old[:80])
              return s.replace(old, new)

          # 1) TelegramCore: local-only visual overrides for own profile
          p = "submodules/TelegramCore/Sources/TelegramEngine/Peers/Peer.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "import Postbox\n", "import Postbox\nimport SwiftSignalKit\n")
          s += r'''

          public final class MyGramVisual: @unchecked Sendable {
              public static let shared = MyGramVisual()
              private let lock = NSLock()
              private var counter: Int = 0
              private let promise = ValuePromise<Int>(0, ignoreRepeated: false)

              public func updates() -> Signal<Int, NoError> {
                  return self.promise.get()
              }

              public func notify() {
                  self.lock.lock()
                  self.counter += 1
                  let value = self.counter
                  self.lock.unlock()
                  self.promise.set(value)
              }
          }

          public func myGramVisualUpdates() -> Signal<Int, NoError> {
              return MyGramVisual.shared.updates()
          }

          public func myGramVisualNotify() {
              MyGramVisual.shared.notify()
          }

          public func myGramSetSelfPeerId(_ id: PeerId) {
              let value = id.toInt64()
              let d = UserDefaults.standard
              if (d.object(forKey: "MyGramSelfPeerId") as? NSNumber)?.int64Value != value {
                  d.set(NSNumber(value: value), forKey: "MyGramSelfPeerId")
              }
          }

          private func myGramDigits(_ string: String?) -> String {
              return (string ?? "").filter { "0123456789".contains($0) }
          }

          private func myGramCleanUsername(_ string: String) -> String {
              return string.trimmingCharacters(in: .whitespacesAndNewlines).replacingOccurrences(of: "@", with: "").replacingOccurrences(of: "t.me/", with: "")
          }

          public func myGramApplyVisual(_ peer: EnginePeer?) -> EnginePeer? {
              guard let peer = peer, case let .user(user) = peer else {
                  return peer
              }
              let d = UserDefaults.standard
              guard let selfId = (d.object(forKey: "MyGramSelfPeerId") as? NSNumber)?.int64Value, selfId == user.id.toInt64() else {
                  return peer
              }
              var result = user

              let main = myGramCleanUsername(d.string(forKey: "MyGramFakeUsername") ?? "")
              let extras = (d.string(forKey: "MyGramFakeUsernames") ?? "")
                  .split(whereSeparator: { $0 == "," || $0 == " " || $0 == "\n" })
                  .map { myGramCleanUsername(String($0)) }
                  .filter { !$0.isEmpty }
              if !main.isEmpty || !extras.isEmpty {
                  var list: [TelegramPeerUsername] = []
                  if !main.isEmpty {
                      list.append(TelegramPeerUsername(flags: [.isEditable, .isActive], username: main))
                  } else {
                      list.append(contentsOf: user.usernames)
                      if list.isEmpty, let username = user.username, !username.isEmpty {
                          list.append(TelegramPeerUsername(flags: [.isEditable, .isActive], username: username))
                      }
                  }
                  for extra in extras {
                      list.append(TelegramPeerUsername(flags: [.isActive], username: extra))
                  }
                  result = result.withUpdatedUsernames(list)
                  if !main.isEmpty {
                      result = result.withUpdatedUsername(main)
                  }
              }

              let phone = myGramDigits(d.string(forKey: "MyGramFakePhone"))
              if !phone.isEmpty {
                  result = result.withUpdatedPhone(phone)
              }

              if d.bool(forKey: "MyGramFakePremium") {
                  var flags = result.flags
                  flags.insert(.isPremium)
                  result = result.withUpdatedFlags(flags)
              }
              return .user(result)
          }

          public func myGramApplyVisualStars(_ state: StarsContext.State?) -> StarsContext.State? {
              guard var state = state else {
                  return nil
              }
              let stars = myGramDigits(UserDefaults.standard.string(forKey: "MyGramFakeStars"))
              if let value = Int64(stars) {
                  state.balance = StarsAmount(value: value, nanos: 0)
              }
              return state
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched TelegramCore visual")

          # 2) Profile / settings data: apply overrides and refresh live
          p = "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoData.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "        self.peer = peer\n        self.chatPeer = chatPeer\n",
              "        self.peer = myGramApplyVisual(peer)\n        self.chatPeer = myGramApplyVisual(chatPeer)\n")
          s = patch(s, "        self.starsState = starsState\n",
              "        self.starsState = myGramApplyVisualStars(starsState)\n")
          s = patch(s, "\n        context.account.viewTracker.peerView(peerId, updateData: true),\n",
              "\n        (combineLatest(context.account.viewTracker.peerView(peerId, updateData: true), myGramVisualUpdates()) |> map { view, _ in view }),\n")
          s = patch(s, "        let peer = peerView.peers[peerId]\n        let globalSettings",
              "        let peer = peerView.peers[peerId]\n        myGramSetSelfPeerId(peerId)\n        let globalSettings")
          open(p, "w", encoding="utf-8").write(s)
          print("patched PeerInfoData")

          # 3) TelegramCore: exact fake phone display
          p = "submodules/TelegramCore/Sources/TelegramEngine/Peers/Peer.swift"
          s = open(p, encoding="utf-8").read()
          s += r'''

          public func myGramFakePhoneDisplay(_ number: String) -> String? {
              let raw = (UserDefaults.standard.string(forKey: "MyGramFakePhone") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
              let fakeDigits = myGramDigits(raw)
              if fakeDigits.isEmpty || myGramDigits(number) != fakeDigits {
                  return nil
              }
              return raw.hasPrefix("+") ? raw : "+" + raw
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched phone display helper")

          p = "submodules/PhoneNumberFormat/Sources/PhoneNumbers.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "public func formatPhoneNumber(_ string: String) -> String {\n",
              "public func formatPhoneNumber(_ string: String) -> String {\n    if let myGramRaw = myGramFakePhoneDisplay(string) { return myGramRaw }\n")
          s = patch(s, "public func formatPhoneNumber(context: AccountContext, number: String) -> String {\n",
              "public func formatPhoneNumber(context: AccountContext, number: String) -> String {\n    if let myGramRaw = myGramFakePhoneDisplay(number) { return myGramRaw }\n")
          open(p, "w", encoding="utf-8").write(s)
          print("patched phone format")

          # 4) "My Stars" screen: show fake balance
          p = "submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "                    self.starsState = state\n",
              "                    self.starsState = component.starsContext.ton ? state : myGramApplyVisualStars(state)\n")
          open(p, "w", encoding="utf-8").write(s)
          print("patched stars screen")
          EOF
          grep -n "myGramApplyVisual" submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoData.swift
          grep -n "myGramFakePhoneDisplay" submodules/PhoneNumberFormat/Sources/PhoneNumbers.swift

      - name: MyGram settings tab
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          def patch(s, old, new, count=1):
              if s.count(old) != count:
                  raise SystemExit("anchor not found: " + old[:80])
              return s.replace(old, new)

          # 1) New screen: Settings -> MyGram
          p = "submodules/SettingsUI/Sources/MyGramSettingsController.swift"
          open(p, "w", encoding="utf-8").write(r'''import Foundation
          import UIKit
          import Display
          import SwiftSignalKit
          import TelegramCore
          import TelegramPresentationData
          import ItemListUI
          import PresentationDataUtils
          import AccountContext

          private enum MyGramEntryKind: Int32, Equatable {
              case header
              case toggle
              case input
              case info
          }

          private struct MyGramEntry: ItemListNodeEntry, Equatable {
              let kind: MyGramEntryKind
              let sectionValue: Int32
              let id: Int32
              let title: String
              let key: String
              let text: String
              let flag: Bool
              let isNumber: Bool

              var section: ItemListSectionId {
                  return self.sectionValue
              }

              var stableId: Int32 {
                  return self.id
              }

              static func ==(lhs: MyGramEntry, rhs: MyGramEntry) -> Bool {
                  return lhs.kind == rhs.kind && lhs.sectionValue == rhs.sectionValue && lhs.id == rhs.id && lhs.title == rhs.title && lhs.key == rhs.key && lhs.text == rhs.text && lhs.flag == rhs.flag && lhs.isNumber == rhs.isNumber
              }

              static func <(lhs: MyGramEntry, rhs: MyGramEntry) -> Bool {
                  return lhs.id < rhs.id
              }

              func item(presentationData: ItemListPresentationData, arguments: Any) -> ListViewItem {
                  let key = self.key
                  switch self.kind {
                  case .header:
                      return ItemListSectionHeaderItem(presentationData: presentationData, text: self.title, sectionId: self.section)
                  case .toggle:
                      return ItemListSwitchItem(presentationData: presentationData, systemStyle: .glass, title: self.title, value: self.flag, sectionId: self.section, style: .blocks, updated: { value in
                          UserDefaults.standard.set(value, forKey: key)
                          myGramVisualNotify()
                      })
                  case .input:
                      return ItemListSingleLineInputItem(presentationData: presentationData, systemStyle: .glass, title: NSAttributedString(string: self.title, textColor: presentationData.theme.list.itemPrimaryTextColor), text: self.text, placeholder: "не задано", type: self.isNumber ? .number : .regular(capitalization: false, autocorrection: false), spacing: 10.0, sectionId: self.section, textUpdated: { updatedText in
                          UserDefaults.standard.set(updatedText, forKey: key)
                          myGramVisualNotify()
                      }, action: {
                      })
                  case .info:
                      return ItemListTextItem(presentationData: presentationData, text: .plain(self.title), sectionId: self.section)
                  }
              }
          }

          private func myGramEntries() -> [MyGramEntry] {
              let d = UserDefaults.standard
              var entries: [MyGramEntry] = []
              func header(_ section: Int32, _ id: Int32, _ text: String) {
                  entries.append(MyGramEntry(kind: .header, sectionValue: section, id: id, title: text, key: "", text: "", flag: false, isNumber: false))
              }
              func toggle(_ section: Int32, _ id: Int32, _ title: String, _ key: String) {
                  entries.append(MyGramEntry(kind: .toggle, sectionValue: section, id: id, title: title, key: key, text: "", flag: d.bool(forKey: key), isNumber: false))
              }
              func input(_ section: Int32, _ id: Int32, _ title: String, _ key: String, _ isNumber: Bool = false) {
                  entries.append(MyGramEntry(kind: .input, sectionValue: section, id: id, title: title, key: key, text: d.string(forKey: key) ?? "", flag: false, isNumber: isNumber))
              }
              func info(_ section: Int32, _ id: Int32, _ text: String) {
                  entries.append(MyGramEntry(kind: .info, sectionValue: section, id: id, title: text, key: "", text: "", flag: false, isNumber: false))
              }

              header(0, 0, "РЕЖИМ ПРИЗРАКА")
              toggle(0, 1, "Скрывать «в сети»", "MyGramGhostMode")
              toggle(0, 2, "Не отправлять прочтение", "MyGramGhostRead")
              toggle(0, 3, "Скрывать «печатает»", "MyGramGhostTyping")
              toggle(0, 4, "Скрытый просмотр историй", "MyGramGhostStories")
              info(0, 5, "Каждый пункт работает отдельно. Прочтение: собеседник не увидит двух галочек, голосовые и кружки не помечаются прослушанными. Если ответить в чат, Telegram сам отметит сообщения прочитанными.")

              header(1, 10, "ВИЗУАЛ (ВИДНО ТОЛЬКО ТЕБЕ)")
              input(1, 11, "Юзернейм", "MyGramFakeUsername")
              input(1, 12, "Доп. юзы", "MyGramFakeUsernames")
              input(1, 13, "Номер", "MyGramFakePhone")
              input(1, 14, "Звёзды", "MyGramFakeStars", true)
              toggle(1, 15, "Значок Premium", "MyGramFakePremium")
              info(1, 16, "Меняется только у тебя: профиль, настройки, «Мои звёзды». Другие видят настоящие данные. Доп. юзы пиши через запятую — покажутся как купленные. Номер показывается ровно так, как ты его ввёл. Пустое поле = настоящее значение.")

              info(2, 20, "Удалённые сообщения сохраняются автоматически и помечаются красной корзиной.")
              return entries
          }

          public func myGramSettingsController(context: AccountContext) -> ViewController {
              let signal = combineLatest(context.sharedContext.presentationData, myGramVisualUpdates())
              |> deliverOnMainQueue
              |> map { presentationData, _ -> (ItemListControllerState, (ItemListNodeState, Any)) in
                  let controllerState = ItemListControllerState(presentationData: ItemListPresentationData(presentationData), title: .text("MyGram"), leftNavigationButton: nil, rightNavigationButton: nil, backNavigationButton: ItemListBackButton(title: presentationData.strings.Common_Back))
                  let listState = ItemListNodeState(presentationData: ItemListPresentationData(presentationData), entries: myGramEntries(), style: .blocks, animateChanges: false)
                  return (controllerState, (listState, 0))
              }
              let controller = ItemListController(context: context, state: signal)
              return controller
          }
          ''')
          print("created MyGramSettingsController")

          # 2) Settings section enum + action
          p = "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "    case stars\n    case ton\n", "    case stars\n    case ton\n    case myGram\n")
          open(p, "w", encoding="utf-8").write(s)

          p = "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreenSettingsActions.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "        case .ton:\n", "        case .myGram:\n            push(myGramSettingsController(context: self.context))\n        case .ton:\n")
          open(p, "w", encoding="utf-8").write(s)

          # 3) Settings list: own block between "Chat folders" and "Notifications"
          p = "submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift"
          s = open(p, encoding="utf-8").read()
          s = patch(s, "    case shortcuts\n    case advanced\n", "    case shortcuts\n    case myGram\n    case advanced\n")
          s = patch(s, "    let notificationsWarning: Bool\n",
              "    items[.myGram]!.append(PeerInfoScreenDisclosureItem(id: 0, text: \"MyGram\", icon: myGramSettingsIcon, action: {\n        interaction.openSettings(.myGram)\n    }))\n    \n    let notificationsWarning: Bool\n")
          s += r'''

          private let myGramSettingsIcon: UIImage? = {
              let size = CGSize(width: 30.0, height: 30.0)
              let renderer = UIGraphicsImageRenderer(size: size)
              return renderer.image { ctx in
                  let rect = CGRect(origin: CGPoint(), size: size)
                  let path = UIBezierPath(roundedRect: rect, cornerRadius: 7.0)
                  ctx.cgContext.addPath(path.cgPath)
                  ctx.cgContext.clip()
                  let colors = [UIColor(red: 0.55, green: 0.30, blue: 0.95, alpha: 1.0).cgColor, UIColor(red: 0.95, green: 0.30, blue: 0.55, alpha: 1.0).cgColor] as CFArray
                  if let gradient = CGGradient(colorsSpace: CGColorSpaceCreateDeviceRGB(), colors: colors, locations: [0.0, 1.0]) {
                      ctx.cgContext.drawLinearGradient(gradient, start: CGPoint(x: 0.0, y: 0.0), end: CGPoint(x: size.width, y: size.height), options: [])
                  }
                  if let symbol = UIImage(systemName: "theatermasks.fill", withConfiguration: UIImage.SymbolConfiguration(pointSize: 15.0, weight: .semibold))?.withTintColor(.white, renderingMode: .alwaysOriginal) {
                      let symbolRect = CGRect(x: (size.width - symbol.size.width) / 2.0, y: (size.height - symbol.size.height) / 2.0, width: symbol.size.width, height: symbol.size.height)
                      symbol.draw(in: symbolRect)
                  }
              }
          }()
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched settings list")
          EOF
          grep -n "myGram" submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoSettingsItems.swift | head
          ls -la submodules/SettingsUI/Sources/MyGramSettingsController.swift

      - name: Sideload fix (no App Group)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramUI/Sources/AppDelegate.swift"
          s = open(p, encoding="utf-8").read()
          old = "let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)"
          new = old + " ?? FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first"
          if old not in s:
              raise SystemExit("AppGroup line not found")
          s = s.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched AppGroup fallback")
          EOF
          grep -n "maybeAppGroupUrl = " submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Sideload fix (no iCloud / CloudKit)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramCore/Sources/Network/Network.swift"
          s = open(p, encoding="utf-8").read()
          old = "!supplementary, arguments.isICloudEnabled {"
          new = '!supplementary, arguments.isICloudEnabled && ProcessInfo.processInfo.environment["MYGRAM_ICLOUD"] != nil {'
          if old not in s:
              raise SystemExit("CloudKit line not found")
          s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patched CloudKit off")
          EOF
          grep -n "MYGRAM_ICLOUD" submodules/TelegramCore/Sources/Network/Network.swift

      - name: Sideload fix (no Siri)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramUI/Sources/AppDelegate.swift"
          s = open(p, encoding="utf-8").read()
          old = "if buildConfig.isSiriEnabled {"
          new = 'if buildConfig.isSiriEnabled && ProcessInfo.processInfo.environment["MYGRAM_SIRI"] != nil {'
          if old not in s:
              raise SystemExit("Siri line not found")
          s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patched Siri off")
          EOF
          grep -n "MYGRAM_SIRI" submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/my-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=$(find -L bazel-out -name Telegram.ipa -path '*opt*' | head -n 1)
          echo "IPA: $IPA"
          cp "$IPA" "$GITHUB_WORKSPACE/out/MyGram.ipa"

      - name: Change Bundle ID and name
        run: |
          cd "$GITHUB_WORKSPACE/out"
          rm -rf ipa && mkdir ipa && cd ipa
          unzip -q ../MyGram.ipa
          rm -rf Payload/*.app/PlugIns Payload/*.app/Watch Payload/*.app/Extensions
          python3 - <<'EOF'
          import plistlib, pathlib
          OLD = "ph.telegra.Telegraph"
          NEW = "com.mygram.app"
          NAME = "MyGram"
          def fix(v):
              if isinstance(v, str):
                  return NEW + v[len(OLD):] if v.startswith(OLD) else v
              if isinstance(v, list):
                  return [fix(x) for x in v]
              if isinstance(v, dict):
                  return {k: fix(x) for k, x in v.items()}
              return v
          app = next(pathlib.Path("Payload").glob("*.app"))
          for p in app.rglob("Info.plist"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              d = fix(d)
              if p.parent == app:
                  d["CFBundleDisplayName"] = NAME
                  d["CFBundleName"] = NAME
              p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
              print("fixed", p, d.get("CFBundleIdentifier"))
          for p in app.glob("*.lproj/InfoPlist.strings"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              if "CFBundleDisplayName" in d:
                  d["CFBundleDisplayName"] = NAME
                  p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
          EOF
          rm -f ../MyGram.ipa
          zip -qry ../MyGram.ipa Payload
          cd .. && rm -rf ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MyGram-ipa
          path: out/MyGram.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MyGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Unsigned build. Sign and install via KSign.
          files: out/MyGram.ipa
