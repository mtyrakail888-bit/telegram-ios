          private let myGramFontChoice: String = UserDefaults.standard.string(forKey: "MyGramFont") ?? ""

          private final class MyGramFontCache: @unchecked Sendable {
              let lock = NSLock()
              var fonts: [String: UIFont] = [:]
          }

          private let myGramFontCache = MyGramFontCache()

          public func myGramCustomFont(_ size: CGFloat, _ weight: UIFont.Weight, _ italic: Bool) -> UIFont? {
              let choice = myGramFontChoice
              if choice.isEmpty {
                  return nil
              }
              let key = "\(size)_\(weight.rawValue)_\(italic)"
              myGramFontCache.lock.lock()
              let cached = myGramFontCache.fonts[key]
              myGramFontCache.lock.unlock()
              if let cached = cached {
                  return cached
              }
              var descriptor: UIFontDescriptor
              let isSystemDesign = choice == "rounded" || choice == "serif" || choice == "mono"
              if isSystemDesign {
                  let base = UIFont.systemFont(ofSize: size, weight: weight).fontDescriptor
                  let design: UIFontDescriptor.SystemDesign = choice == "rounded" ? .rounded : (choice == "serif" ? .serif : .monospaced)
                  descriptor = base.withDesign(design) ?? base
              } else {
                  descriptor = UIFontDescriptor(fontAttributes: [.family: choice]).addingAttributes([.traits: [UIFontDescriptor.TraitKey.weight: weight]])
              }
              if italic, let italicDescriptor = descriptor.withSymbolicTraits(descriptor.symbolicTraits.union(.traitItalic)) {
                  descriptor = italicDescriptor
              }
              let font = UIFont(descriptor: descriptor, size: size)
              if !isSystemDesign && font.familyName != choice {
                  return nil
              }
              myGramFontCache.lock.lock()
              myGramFontCache.fonts[key] = font
              myGramFontCache.lock.unlock()
              return font
          }
          '''
