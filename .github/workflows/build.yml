name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            XCODE="/Applications/Xcode_$WANT.app"
          else
            XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Create configuration
        env:
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "Secrets TG_API_ID / TG_API_HASH are missing"; exit 1
          fi
          python3 - <<'EOF'
          import json, os
          c = json.load(open("build-system/appstore-configuration.json"))
          c["api_id"] = os.environ["API_ID"]
          c["api_hash"] = os.environ["API_HASH"]
          json.dump(c, open("build-system/my-configuration.json", "w"), indent=2)
          EOF

      - name: Copy sources to stable path
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown $(whoami) /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Ignore expired fake profiles
        run: |
          cd /Users/Shared/telegram-ios
          F=build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py
          sed -i '' 's/raise PlistToolError(ENTITLEMENTS_PROFILE_HAS_EXPIRED/print(ENTITLEMENTS_PROFILE_HAS_EXPIRED/' "$F"
          grep -n "ENTITLEMENTS_PROFILE_HAS_EXPIRED %" "$F"

      - name: Keep deleted messages (red trash icon)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          # 1) TelegramCore: keep deleted messages and remember their ids
          p = "submodules/TelegramCore/Sources/State/Sync/StateReplay+Messages.swift"
          s = open(p, encoding="utf-8").read()
          a = "    func applyDeleteMessagesWithGlobalIds(_ ids: [Int32]) {\n"
          b = "    func applyDeleteMessages(_ ids: [MessageId]) {\n"
          if a not in s or b not in s:
              raise SystemExit("delete functions not found")
          s = s.replace(a, a + "        if !ids.isEmpty { myGramMarkDeleted(transaction.messageIdsForGlobalIds(ids)); return } // MyGram: keep deleted messages\n", 1)
          s = s.replace(b, b + "        if !ids.isEmpty { myGramMarkDeleted(ids); return } // MyGram: keep deleted messages\n", 1)
          s += r'''

          public final class MyGramDeletedStore: @unchecked Sendable {
              public static let shared = MyGramDeletedStore()
              private let lock = NSLock()
              private var ids: Set<String>

              private init() {
                  self.ids = Set(UserDefaults.standard.stringArray(forKey: "MyGramDeletedMessages") ?? [])
              }

              private static func key(_ id: MessageId) -> String {
                  return "\(id.peerId.toInt64()):\(id.namespace):\(id.id)"
              }

              public func contains(_ id: MessageId) -> Bool {
                  self.lock.lock()
                  defer { self.lock.unlock() }
                  return self.ids.contains(MyGramDeletedStore.key(id))
              }

              public func add(_ newIds: [MessageId]) {
                  self.lock.lock()
                  for id in newIds {
                      self.ids.insert(MyGramDeletedStore.key(id))
                  }
                  let all = Array(self.ids)
                  self.lock.unlock()
                  UserDefaults.standard.set(all, forKey: "MyGramDeletedMessages")
              }
          }

          public func myGramIsMessageDeleted(_ id: MessageId) -> Bool {
              return MyGramDeletedStore.shared.contains(id)
          }

          extension ReplayContext {
              func myGramMarkDeleted(_ ids: [MessageId]) {
                  MyGramDeletedStore.shared.add(ids)
                  for id in ids {
                      transaction.updateMessage(id, update: { currentMessage in
                          let storeForwardInfo = currentMessage.forwardInfo.flatMap(StoreMessageForwardInfo.init)
                          return .update(StoreMessage(id: currentMessage.id, customStableId: nil, globallyUniqueId: currentMessage.globallyUniqueId, groupingKey: currentMessage.groupingKey, threadId: currentMessage.threadId, timestamp: currentMessage.timestamp, flags: StoreMessageFlags(currentMessage.flags), tags: currentMessage.tags, globalTags: currentMessage.globalTags, localTags: currentMessage.localTags, forwardInfo: storeForwardInfo, authorId: currentMessage.author?.id, text: currentMessage.text, attributes: currentMessage.attributes, media: currentMessage.media))
                      })
                  }
              }
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched TelegramCore")

          # 2) Time string: add invisible marker for deleted messages
          p = "submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/StringForMessageTimestampStatus.swift"
          s = open(p, encoding="utf-8").read()
          old = "public func stringForMessageTimestampStatus("
          if s.count(old) != 1:
              raise SystemExit("stringForMessageTimestampStatus not found")
          s = s.replace(old, "private func myGramOriginalStringForMessageTimestampStatus(")
          s += r'''

          public func stringForMessageTimestampStatus(
              context: AccountContext,
              message: EngineMessage,
              dateTimeFormat: PresentationDateTimeFormat,
              nameDisplayOrder: PresentationPersonNameOrder,
              strings: PresentationStrings,
              format: MessageTimestampStatusFormat = .regular,
              associatedData: ChatMessageItemAssociatedData,
              ignoreAuthor: Bool = false
          ) -> String {
              let result = myGramOriginalStringForMessageTimestampStatus(context: context, message: message, dateTimeFormat: dateTimeFormat, nameDisplayOrder: nameDisplayOrder, strings: strings, format: format, associatedData: associatedData, ignoreAuthor: ignoreAuthor)
              if myGramIsMessageDeleted(message.id) {
                  return result + "\u{2063}"
              }
              return result
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched timestamp string")

          # 3) Date node: red trash icon next to the time
          p = "submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/ChatMessageDateAndStatusNode.swift"
          s = open(p, encoding="utf-8").read()
          old1 = "        return { [weak self] arguments in\n"
          old2 = "            var updatedDateText = arguments.dateText\n"
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit("date node anchors not found")
          s = s.replace(old1, "        return { [weak self] myGramArguments in\n            let (arguments, myGramIsDeleted) = myGramFixDateArguments(myGramArguments)\n")
          s = s.replace(old2, "            if myGramIsDeleted && arguments.replyCount == 0 {\n                repliesImage = myGramTrashImage()\n            }\n" + old2)
          s += r'''

          private func myGramFixDateArguments(_ arguments: ChatMessageDateAndStatusNode.Arguments) -> (ChatMessageDateAndStatusNode.Arguments, Bool) {
              guard arguments.dateText.hasSuffix("\u{2063}") else {
                  return (arguments, false)
              }
              var result = arguments
              result.dateText = String(arguments.dateText.dropLast())
              result.isPinned = true
              return (result, true)
          }

          private func myGramTrashImage() -> UIImage? {
              guard let symbol = UIImage(systemName: "trash.fill", withConfiguration: UIImage.SymbolConfiguration(pointSize: 9.0, weight: .semibold))?.withTintColor(UIColor(red: 1.0, green: 0.23, blue: 0.19, alpha: 1.0), renderingMode: .alwaysOriginal) else {
                  return nil
              }
              let renderer = UIGraphicsImageRenderer(size: symbol.size)
              return renderer.image { _ in
                  symbol.draw(at: CGPoint())
              }
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched date node")
          EOF
          grep -n "MyGram\|myGram" submodules/TelegramCore/Sources/State/Sync/StateReplay+Messages.swift | head
          grep -n "myGram" submodules/TelegramUI/Components/Chat/ChatMessageDateAndStatusNode/Sources/*.swift

      - name: Sideload fix (no App Group)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramUI/Sources/AppDelegate.swift"
          s = open(p, encoding="utf-8").read()
          old = "let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)"
          new = old + " ?? FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first"
          if old not in s:
              raise SystemExit("AppGroup line not found")
          s = s.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched AppGroup fallback")
          EOF
          grep -n "maybeAppGroupUrl = " submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Sideload fix (no iCloud / CloudKit)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramCore/Sources/Network/Network.swift"
          s = open(p, encoding="utf-8").read()
          old = "!supplementary, arguments.isICloudEnabled {"
          new = '!supplementary, arguments.isICloudEnabled && ProcessInfo.processInfo.environment["MYGRAM_ICLOUD"] != nil {'
          if old not in s:
              raise SystemExit("CloudKit line not found")
          s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patched CloudKit off")
          EOF
          grep -n "MYGRAM_ICLOUD" submodules/TelegramCore/Sources/Network/Network.swift

      - name: Sideload fix (no Siri)
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          p = "submodules/TelegramUI/Sources/AppDelegate.swift"
          s = open(p, encoding="utf-8").read()
          old = "if buildConfig.isSiriEnabled {"
          new = 'if buildConfig.isSiriEnabled && ProcessInfo.processInfo.environment["MYGRAM_SIRI"] != nil {'
          if old not in s:
              raise SystemExit("Siri line not found")
          s = s.replace(old, new)
          open(p, "w", encoding="utf-8").write(s)
          print("patched Siri off")
          EOF
          grep -n "MYGRAM_SIRI" submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Build
        run: |
          set -x
          cd /Users/Shared/telegram-ios
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            build \
            --configurationPath="build-system/my-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/out"
          IPA=$(find -L bazel-out -name Telegram.ipa -path '*opt*' | head -n 1)
          echo "IPA: $IPA"
          cp "$IPA" "$GITHUB_WORKSPACE/out/MyGram.ipa"

      - name: Change Bundle ID and name
        run: |
          cd "$GITHUB_WORKSPACE/out"
          rm -rf ipa && mkdir ipa && cd ipa
          unzip -q ../MyGram.ipa
          rm -rf Payload/*.app/PlugIns Payload/*.app/Watch Payload/*.app/Extensions
          python3 - <<'EOF'
          import plistlib, pathlib
          OLD = "ph.telegra.Telegraph"
          NEW = "com.mygram.app"
          NAME = "MyGram"
          def fix(v):
              if isinstance(v, str):
                  return NEW + v[len(OLD):] if v.startswith(OLD) else v
              if isinstance(v, list):
                  return [fix(x) for x in v]
              if isinstance(v, dict):
                  return {k: fix(x) for k, x in v.items()}
              return v
          app = next(pathlib.Path("Payload").glob("*.app"))
          for p in app.rglob("Info.plist"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              d = fix(d)
              if p.parent == app:
                  d["CFBundleDisplayName"] = NAME
                  d["CFBundleName"] = NAME
              p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
              print("fixed", p, d.get("CFBundleIdentifier"))
          for p in app.glob("*.lproj/InfoPlist.strings"):
              try:
                  d = plistlib.loads(p.read_bytes())
              except Exception:
                  continue
              if "CFBundleDisplayName" in d:
                  d["CFBundleDisplayName"] = NAME
                  p.write_bytes(plistlib.dumps(d, fmt=plistlib.FMT_BINARY))
          EOF
          rm -f ../MyGram.ipa
          zip -qry ../MyGram.ipa Payload
          cd .. && rm -rf ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MyGram-ipa
          path: out/MyGram.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MyGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Unsigned build. Sign and install via KSign.
          files: out/MyGram.ipa
